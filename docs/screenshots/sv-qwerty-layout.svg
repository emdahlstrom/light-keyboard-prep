<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 172" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #000; }
      .key { fill: none; }
      .lbl { fill: #fff; font-size: 15px; text-anchor: middle; }
      .sm  { fill: #fff; font-size: 10px; text-anchor: middle; }
      .accent { fill: #888; font-size: 9px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="172"/>
  <!-- Row 1: qwertyuiopå — 11 keys x 32dp = 352, centered (offset 4) -->
  <g class="lbl">
    <text x="20" y="26">q</text><text x="52" y="26">w</text><text x="84" y="26">e</text>
    <text x="116" y="26">r</text><text x="148" y="26">t</text><text x="180" y="26">y</text>
    <text x="212" y="26">u</text><text x="244" y="26">i</text><text x="276" y="26">o</text>
    <text x="308" y="26">p</text><text x="340" y="26">å</text>
  </g>
  <!-- Row 2: asdfghjklöä -->
  <g class="lbl">
    <text x="20" y="66">a</text><text x="52" y="66">s</text><text x="84" y="66">d</text>
    <text x="116" y="66">f</text><text x="148" y="66">g</text><text x="180" y="66">h</text>
    <text x="212" y="66">j</text><text x="244" y="66">k</text><text x="276" y="66">l</text>
    <text x="308" y="66">ö</text><text x="340" y="66">ä</text>
  </g>
  <!-- Row 3: shift + zxcvbnm + backspace -->
  <g class="lbl">
    <text x="30" y="106" class="sm">⇧</text>
    <text x="85" y="106">z</text><text x="117" y="106">x</text><text x="149" y="106">c</text>
    <text x="181" y="106">v</text><text x="213" y="106">b</text><text x="245" y="106">n</text>
    <text x="277" y="106">m</text>
    <text x="330" y="106" class="sm">⌫</text>
  </g>
  <!-- Final row: 123, emoji, space, mic, return -->
  <g class="sm">
    <text x="32" y="146">123</text>
    <text x="76" y="146">☺</text>
    <text x="285" y="146">🎤</text>
    <text x="330" y="146">↵</text>
  </g>
  <line x1="110" y1="150" x2="250" y2="150" stroke="#fff" stroke-width="2"/>
  <text x="180" y="166" class="accent">mellanslag (2dp-strecket är LP3:s mellanslagstangent)</text>
</svg>
